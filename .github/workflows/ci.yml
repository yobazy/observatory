name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    # The app only builds for macOS, so CI runs there too.
    runs-on: macos-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm packages
        run: npm ci

      # tsc, then vite. tauri::generate_context! needs dist/ to exist,
      # so this runs before any cargo step.
      - name: Typecheck and build the frontend
        run: npm run build

      - name: Test the frontend
        run: npm test

      # The version and components come from src-tauri/rust-toolchain.toml.
      - name: Install Rust
        working-directory: src-tauri
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Check clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test the backend
        working-directory: src-tauri
        run: cargo test --locked
