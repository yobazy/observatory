name: Feature idea
description: Suggest something new, or propose a change before building it
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What's hard or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Mockups are welcome.
  - type: checkboxes
    id: build
    attributes:
      label: Building it
      options:
        - label: I'd like to build this myself
